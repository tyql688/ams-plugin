# --------------------------------------------------------
# 渲染与视觉配置
# --------------------------------------------------------

render:
  scale: 100 # 渲染缩放百分比，100 为原始尺寸 (50-200)

panel_black_bg: true # 普通与极限角色面板背景：true 黑色疏星，false 属性疏星；两种均保留表格渐透

gacha_show_all: false # 抽卡记录是否展示全部池子；false 仅展示 4 个主池（精准角色/武器、常驻角色/武器），true 展示新手/感恩等全部

yuantu_pile: true # 立绘原图开关
yuantu_bg: true # 背景原图开关

# --------------------------------------------------------
# 定时任务配置
# --------------------------------------------------------

signin_time: 0 10 0 * * ? # 自动签到执行时间 (Cron表达式)
anns_push_time: 0 0/10 * * * ? # 公告推送检测频率

# --------------------------------------------------------
# 功能开关
# --------------------------------------------------------

auto_signin: false # 自动签到开关
anns_push: false # 公告推送开关
resource_auto_update: true # 每 5 分钟同步资源，有改动时重启 Yunzai 并通知主人

signin_switch: true # 签到功能：是否全局开启手动签到命令

at_query: false # @ 查询开关：开启后可 @ 他人查询其绑定的鸣潮数据（仅查询类命令；登录/签到/Token 等敏感命令始终只认本人）

# --------------------------------------------------------
# 角色数据配置
# --------------------------------------------------------

multi_daily: true # 多角色体力开关
multi_daily_forward: 3 # 转发阈值：超过几个角色后将结果转为合并记录形式转发
